[build-system]
requires = ["setuptools>=84.0.0", "setuptools-scm>=10.3.4"]
build-backend = "setuptools.build_meta"

[project]
name = "Red-GitHubBot"
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.14.4",
    "apscheduler[sqlalchemy]>=3.11.3",
    "cachetools>=7.2.0",
    "cherry-picker>=2.7.0",
    "discord.py>=2.7.1",
    "gidgethub>=6.0.0",
    "graphql-builder==1.0.0a3",
    "markdownify>=1.2.3",
    "mistune>=3.3.4",
    "psycopg2>=2.9.13",
    "regex>=2026.9.29",
    "sentry-sdk[pure-eval]>=2.71.0",
    "yarl>=1.25.1",
]
dynamic = ["version"]

[tool.setuptools_scm]

[dependency-groups]
dev = [
    "ruff>=0.16.9",
]

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true } }]

[tool.ruff]
line-length = 99

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = [
    # mccabe
    "C90",
    # pyflakes rules
    "F",
    # pycodestyle rules
    "E",
    "W",
    # import sorting
    "I",
    # pygrep-hooks
    "PGH",
]
ignore = [
    "E203",
]

[tool.ruff.lint.isort]
combine-as-imports = true
